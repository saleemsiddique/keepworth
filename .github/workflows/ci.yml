name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 is the real requirement: the project targets iOS 26 and needs that SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Select Xcode by version rather than by path: the exact app name changes between
      # runner images, so `xcode-select -s /Applications/Xcode_26.app` breaks as soon as
      # GitHub updates the image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install Tuist
        uses: jdx/mise-action@v2

      - name: Resolve dependencies
        run: tuist install

      # Generate the project. A change that breaks the dependency law between modules
      # fails here, before a single line is compiled.
      - name: Generate project
        run: tuist generate --no-open

      # `Keepworth-Workspace` is the autogenerated scheme grouping the five test targets.
      # The `Keepworth` scheme is the app's, and its test action is empty: using it would
      # run zero tests without saying so.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Keepworth.xcworkspace \
            -scheme Keepworth-Workspace \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            | xcbeautify
        env:
          NSUnbufferedIO: YES

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Check formatting
        run: |
          xcrun swift-format lint \
            --configuration .swift-format \
            --recursive --strict \
            Modules Apps
