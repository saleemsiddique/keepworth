name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 es el requisito real: el proyecto apunta a iOS 26 y necesita ese SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Seleccionar Xcode por versión en vez de por ruta: el nombre exacto de la app
      # cambia entre imágenes de runner y `xcode-select -s /Applications/Xcode_26.app`
      # se rompe en cuanto GitHub actualiza la imagen.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Install Tuist
        uses: jdx/mise-action@v2

      - name: Resolve dependencies
        run: tuist install

      # Genera el proyecto. Un cambio que rompa la ley de dependencias entre módulos
      # falla aquí, antes de compilar una sola línea.
      - name: Generate project
        run: tuist generate --no-open

      # `Keepworth-Workspace` es el esquema autogenerado que agrupa los cinco targets
      # de test. El esquema `Keepworth` es solo el de la app y su acción de test está
      # vacía: usarlo ejecutaría cero tests sin decirlo.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Keepworth.xcworkspace \
            -scheme Keepworth-Workspace \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            | xcbeautify
        env:
          NSUnbufferedIO: YES

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Check formatting
        run: |
          xcrun swift-format lint \
            --configuration .swift-format \
            --recursive --strict \
            Modules Apps
